[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "product-market-research"
version = "2.0.0"
description = "Evidence-backed product research from a natural-language brief"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6,<7", "requests>=2.32,<3", "beautifulsoup4>=4.12,<5"]

[project.optional-dependencies]
dev = ["pytest>=7,<9"]
pdf = ["reportlab>=4,<6", "Pillow>=10,<13"]

[project.scripts]
market-research = "market_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
market_research = ["ui/assets/*", "llm/prompts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
